# =============================================================================
# CraftVoice – Lokales Gesamt-Setup (unabhängig vom winfprojekt.de-Server)
# =============================================================================
# Startet: PostgreSQL, Keycloak (mit Realm-Import), die vier Backend-Services
# (fertige GHCR-Images) und das lokal gebaute Frontend.
#
# Nicht enthalten: Process Engine (Build braucht CIB-Secrets) und ai-service
# (braucht MegaLLM/Deepgram-Keys). Login, Profil, Firma, Dashboard, Katalog
# und Dokumente funktionieren; Sprach-/KI-Angebotserstellung nicht.
#
# Keycloak wird im Browser über localhost:8090 und aus den Backend-Containern
# über host.docker.internal:8090 erreicht. Die Backend-Services akzeptieren
# deshalb explizit den Browser-Issuer http://localhost:8090/realms/handwerker-realm.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL – eine Instanz, vier Datenbanken (über backend/init angelegt)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: cv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: craftvoice-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Keycloak – mit Realm-Import (handwerker-realm.json) und Admin-User
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    platform: linux/amd64
    container_name: cv-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # CDS (Class Data Sharing) abschalten -> umgeht den "shared archive"/JFR-Startfehler
      JAVA_OPTS_APPEND: "-Xshare:off -XX:+IgnoreUnrecognizedVMOptions"
    volumes:
      # Keycloak erwartet beim Verzeichnis-Import den Namen <realm>-realm.json
      - ./keycloak/handwerker-realm.json:/opt/keycloak/data/import/handwerker-realm-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8090:8080"

  # ---------------------------------------------------------------------------
  # User-Service (OIDC aktiv – validiert Login-Token, legt User lazy an)
  # ---------------------------------------------------------------------------
  user-service:
    image: ghcr.io/thi-projekte/handwerker/user-service:${BACKEND_TAG}
    platform: linux/amd64
    container_name: cv-user-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: user-db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: http://host.docker.internal:8090
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8090/realms/handwerker-realm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Offer-Service (OIDC aktiv; Rollen aus resource_access/frontend/roles)
  # ---------------------------------------------------------------------------
  offer-service:
    image: ghcr.io/thi-projekte/handwerker/offer-service:${BACKEND_TAG}
    platform: linux/amd64
    container_name: cv-offer-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: offer-db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://host.docker.internal:8090/realms/handwerker-realm
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8090/realms/handwerker-realm
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:5173
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Authorization,Content-Type,Accept
      USER_SERVICE_URL: http://user-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      # Process Engine ist lokal nicht vorhanden – Angebotserstellung schlägt daher fehl.
      PE_URL: http://localhost:8085/engine-rest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Catalog-Service (OIDC im Projekt-Default deaktiviert -> ohne Auth nutzbar)
  # ---------------------------------------------------------------------------
  catalog-service:
    image: ghcr.io/thi-projekte/handwerker/catalog-service:${BACKEND_TAG}
    platform: linux/amd64
    container_name: cv-catalog-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: catalog-db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_OIDC_TENANT_ENABLED: "false"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Document-Service (Auth lokal deaktiviert, CORS für das Frontend aktiviert)
  # ---------------------------------------------------------------------------
  document-service:
    image: ghcr.io/thi-projekte/handwerker/document-service:${BACKEND_TAG}
    platform: linux/amd64
    container_name: cv-document-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: document-db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_OIDC_TENANT_ENABLED: "false"
      DOCUMENT_AUTH_ENABLED: "false"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:5173"
      USER_SERVICE_URL: http://user-service:8080
      OFFER_SERVICE_URL: http://offer-service:8080
    volumes:
      - document_files:/data/documents
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend – lokal aus dem Quellcode gebaut (liest frontend/.env beim Build)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: local-setup/Dockerfile.frontend
    container_name: cv-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - offer-service

volumes:
  postgres_data:
  document_files:
  keycloak_data:
