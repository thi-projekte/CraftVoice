# =====================================================================================
# [Squad P] KOPIERT AUS: backend/services/user-service/src/main/resources/application.properties
# NEUER ORT: resources/  (Konfiguration des user-service)
# -------------------------------------------------------------------------------------
# WAS JETZT IN DIESER DATEI ZU TUN IST:
#
# 1. SICHERHEIT - hart codierte Zugangsdaten durch Env-Variablen ersetzen (nicht im Repo!):
#      quarkus.oidc.credentials.secret=secret
#        -> ${USER_SERVICE_OIDC_SECRET}
#      quarkus.keycloak.admin-client.username=admin / password=admin
#        -> ${KEYCLOAK_ADMIN_USER} / ${KEYCLOAK_ADMIN_PASSWORD}
#        (besser: eigener Service-Account-Client mit grant-type=client_credentials
#         und nur den Rollen manage-users/view-users statt Master-Admin)
#
# 2. Realm "handwerker-realm" steht hier in der OIDC-URL UND hart codiert in
#    application/UserService.java (REALM) -> eigene Property einführen, z.B.
#      craftvoice.keycloak.realm=${KEYCLOAK_REALM:handwerker-realm}
#    und im Code per @ConfigProperty lesen.
#
# 3. DOCUMENT_STORAGE_PATH (Profilbild-Ablage, siehe UserService.uploadProfilePicture)
#    wird im Code mit Default /tmp gelesen, steht hier aber nicht -> explizit eintragen.
#
# 4. quarkus.hibernate-orm.database.generation=update ist für Produktion riskant
#    -> mittelfristig Flyway/Liquibase-Migrationen verwenden.
# =====================================================================================

# --- PRODUCTION CONFIG (For Docker/Server) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:user-db}

quarkus.hibernate-orm.database.generation=update
quarkus.http.port=8080

# Keycloak OIDC
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/handwerker-realm
quarkus.oidc.client-id=user-service
quarkus.oidc.credentials.secret=secret

# Keycloak Admin Client
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8080}
quarkus.keycloak.admin-client.realm=master
quarkus.keycloak.admin-client.username=admin
quarkus.keycloak.admin-client.password=admin
quarkus.keycloak.admin-client.grant-type=password

quarkus.mailer.mock=true
quarkus.log.level=INFO

# CORS for frontend and craftvoice domains (required for browser requests)
# ACHTUNG: user-service laeuft auf Quarkus 3.15.1 -> hier heisst der Schalter noch
# "quarkus.http.cors" (NICHT ".enabled"; das kam erst in neueren Versionen, siehe catalog-service 3.36).
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,https://cv.winfprojekt.de,https://craftvoice.winfprojekt.de
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# --- TEST OVERRIDES (Only active during 'mvn test' in CI) ---
# This fixes the "UnknownHostException: postgres" error
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Disable Security for CI tests to avoid connection errors to Keycloak
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.admin-client.server-url=http://localhost:8081
